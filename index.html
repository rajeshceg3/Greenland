<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalaallit — Discover Greenland</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="A serene, map-first travel application for Greenland.">
    <meta name="theme-color" content="#0C1C2C">
</head>
<body>

    <!-- Immersive Landing -->
    <div id="landing-screen" class="landing-screen">
        <canvas id="snow-canvas"></canvas>
        <div class="landing-content">
            <h1 class="landing-title">Kalaallit</h1>
            <p class="landing-subtitle">Discover Greenland</p>
            <button id="enter-btn" class="enter-btn">Enter</button>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Destination Focus Mode (Bottom Sheet) -->
    <div id="glass-panel" class="glass-panel hidden">
        <div class="panel-handle"></div>
        <div class="panel-content">
            <h2 id="location-title">Location Name</h2>
            <p id="location-desc">Short poetic descriptor.</p>
            <div class="panel-actions">
                <button id="explore-btn" class="action-btn">Explore</button>
                <button id="route-btn" class="action-btn">Route</button>
                <button id="save-btn" class="action-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Experience Detail Mode (Full Screen Modal) -->
    <div id="detail-modal" class="detail-modal hidden">
        <button id="close-modal" class="close-btn">&times;</button>
        <div class="modal-content">
            <h2 id="modal-title">Location Details</h2>
            <div class="tabs">
                <button class="tab-btn active" data-tab="overview">Overview</button>
                <button class="tab-btn" data-tab="history">History</button>
                <button class="tab-btn" data-tab="climate">Climate</button>
                <button class="tab-btn" data-tab="bestTime">Best Time</button>
                <button class="tab-btn" data-tab="logistics">Logistics</button>
            </div>
            <div id="tab-content" class="tab-content">
                <!-- Content will be injected here -->
                <p>Overview content...</p>
            </div>
        </div>
    </div>

    <!-- Environmental Insight Toggle -->
    <button id="insight-toggle" class="insight-toggle hidden">❄️ Insight</button>
    <button id="sound-toggle" class="insight-toggle hidden" style="right: 10rem;">🔊 Sound</button>

    <div id="insight-slider-container" class="insight-slider-container hidden" style="position: absolute; bottom: 2rem; right: 2rem; z-index: 1000; background: rgba(12, 28, 44, 0.8); padding: 1rem; border-radius: 12px; backdrop-filter: blur(5px); border: 1px solid var(--ice-shadow); color: var(--glacier-blue);">
        <label for="year-slider" style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem;">Glacier Timeline</label>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <input type="range" min="1900" max="2100" value="2023" id="year-slider" style="accent-color: var(--aurora-accent);">
            <span id="year-display" style="font-family: monospace; font-size: 1.1rem;">2023</span>
        </div>
    </div>

    <audio id="ambient-audio" loop>
        <source src="" type="audio/mp3">
    </audio>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="src/main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
